name: RSS-Feed aktualisieren

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub führt geplante Jobs teils mit Verzögerung aus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Feed abrufen und umwandeln
        run: python3 .github/scripts/fetch_rss.py

      - name: Änderungen committen
        run: |
          if git diff --quiet -- rss/feed.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss/feed.json
          git commit -m "RSS-Feed aktualisiert"
          git pull --rebase --quiet
          git push
