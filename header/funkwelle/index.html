<title>VIVASECUR · PMRExpo 2026</title>
<style>
:root {
  --teal: #00829b; --teal-l: #5fc6d4; --deep: #072a32;
  --u: min(1vw, 3.3vh);
}
/* eher quadratisch / hoch: Inhalt untereinander */
@media (max-aspect-ratio: 7/5) {
  :root { --u: min(1.6vw, 2vh); }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); }
body { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: #fff; }

.hdr {
  position: fixed; inset: 0; overflow: hidden;
  display: flex; flex-direction: column;
  background: linear-gradient(110deg, var(--deep) 0%, #0b4855 38%, #12768a 72%, var(--teal) 100%);
}

/* ===== großes S als Sender, Wellen laufen davon weg ===== */
.emit { position: absolute; right: 8%; top: 46%; width: 0; height: 0; }
.big-s { position: absolute; height: calc(var(--u) * 24); width: auto; transform: translate(-50%, -50%); opacity: 0.16; }
.big-s path { fill: #fff; }
.arc {
  position: absolute; border-radius: 50%;
  border: calc(var(--u) * 0.25) solid transparent;
  border-left-color: var(--teal-l);
  transform: translate(-50%, -50%);
  animation: arc 4.5s ease-out infinite;
  opacity: 0;
}
.arc:nth-child(2) { animation-delay: 1.5s; }
.arc:nth-child(3) { animation-delay: 3s; }
@keyframes arc {
  0%   { width: calc(var(--u) * 24); height: calc(var(--u) * 24); opacity: 0.9; }
  100% { width: calc(var(--u) * 90); height: calc(var(--u) * 90); opacity: 0; }
}

/* ===== Inhalt ===== */
.main {
  position: relative; flex: 1; min-height: 0;
  display: flex; align-items: center; gap: calc(var(--u) * 5);
  padding: 0 calc(var(--u) * 5);
}
.logo { width: calc(var(--u) * 30); height: auto; display: block; flex: none; }
.logo .lt { fill: #fff; }
.logo .ls { fill: #00829b; } /* offizielles VIVASECUR-Petrol */
.sep { flex: none; width: calc(var(--u) * 0.35); align-self: stretch; margin: calc(var(--u) * 3.5) 0; background: var(--teal-l); border-radius: 9px; opacity: 0.85; }
.txt { min-width: 0; }
.kick { font-size: calc(var(--u) * 1.6); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal-l); }
.h { margin-top: calc(var(--u) * 0.4); font-size: calc(var(--u) * 7); line-height: 1; white-space: nowrap; letter-spacing: -0.01em; }
.h .a { font-weight: 300; }
.h .b { font-weight: 800; }
.date { margin-top: calc(var(--u) * 0.9); font-size: calc(var(--u) * 2.1); font-weight: 500; opacity: 0.92; white-space: nowrap; }
.stand {
  display: inline-flex; align-items: center; gap: 0.5em;
  margin-top: calc(var(--u) * 1.1);
  padding: 0.3em 0.85em 0.3em 0.7em;
  border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  font-size: calc(var(--u) * 1.8); font-weight: 700; letter-spacing: 0.03em; white-space: nowrap;
}
.stand svg { width: 1.1em; height: 1.1em; fill: none; stroke: var(--teal-l); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.stand i { font-style: normal; opacity: 0.55; font-weight: 500; }

/* ===== Laufband mit den Begriffen der Messewand ===== */
.ticker {
  position: relative; flex: none; overflow: hidden;
  height: calc(var(--u) * 4.2);
  background: rgba(0, 0, 0, 0.22);
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  display: flex; align-items: center;
}
.track { display: flex; white-space: nowrap; animation: run 45s linear infinite; }
.track span {
  font-size: calc(var(--u) * 1.45); font-weight: 700; letter-spacing: 0.16em;
  color: rgba(255, 255, 255, 0.8); padding: 0 calc(var(--u) * 1.6);
}
.track span::after { content: "◆"; color: var(--teal-l); font-size: 0.7em; margin-left: calc(var(--u) * 3.2); position: relative; top: -0.1em; }
@keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ===== Untereinander (quadratisch / hoch) ===== */
@media (max-aspect-ratio: 7/5) {
  .main { flex-direction: column; justify-content: center; align-items: flex-start; gap: calc(var(--u) * 3.5); padding: calc(var(--u) * 5); }
  .sep { width: calc(var(--u) * 12); height: calc(var(--u) * 0.35); align-self: flex-start; margin: 0; }
  .emit { right: 14%; top: auto; bottom: 22%; }
}
/* sehr flach: Laufband weglassen */
@media (max-height: 150px) and (min-aspect-ratio: 7/5) {
  .ticker, .kick { display: none; }
}

@media (prefers-reduced-motion: reduce) { .arc, .track { animation: none; } }
</style>
