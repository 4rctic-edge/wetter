<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<title>VIVASECUR · PMRExpo 2026</title>
<style>
/* ===== Farben (wie Wetter- und RSS-Kachel) & Grundmaß ===== */
:root {
  --bg: #11171d; --tile: #1b242d; --bd: #2c3842; --box: #24313c; --box-bd: #33424f;
  --t1: #eff5f8; --t2: #b4c0c9; --lab: #8a99a6;
  --teal: #16879b; --teal-l: #4fc0d0;
  --u: min(1vw, 3.3vh);
}
/* eher quadratisch / hoch: Inhalt untereinander */
@media (max-aspect-ratio: 7/5) {
  :root { --u: min(1.75vw, 2vh); }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--t1); }

.hdr {
  position: fixed; inset: 0; overflow: hidden;
  display: flex; align-items: center;
  padding: 0 calc(var(--u) * 4);
  gap: calc(var(--u) * 3.5);
  background:
    radial-gradient(ellipse 45% 120% at 14% 50%, rgba(22, 135, 155, 0.30), transparent 70%),
    var(--tile);
  border: 1px solid var(--bd);
  border-radius: max(6px, calc(var(--u) * 0.9));
}
.hdr::after {
  /* feine Akzentlinie unten */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 0.35);
  background: linear-gradient(90deg, transparent, var(--teal) 25%, var(--teal-l) 60%, transparent);
  opacity: 0.8;
}

/* ===== Funkwellen ===== */
.waves { position: absolute; right: calc(var(--u) * 7); top: 50%; width: 0; height: 0; }
.waves i {
  position: absolute; left: 0; top: 0;
  width: calc(var(--u) * 70); height: calc(var(--u) * 70);
  margin: calc(var(--u) * -35) 0 0 calc(var(--u) * -35);
  border: calc(var(--u) * 0.18) solid var(--teal-l); border-radius: 50%;
  opacity: 0; transform: scale(0.1);
  animation: wave 8s linear infinite;
}
.waves i:nth-child(2) { animation-delay: -2s; }
.waves i:nth-child(3) { animation-delay: -4s; }
.waves i:nth-child(4) { animation-delay: -6s; }
@keyframes wave { 0% { transform: scale(0.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 0; } }
.waves b {
  position: absolute; width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2);
  margin: calc(var(--u) * -1.1) 0 0 calc(var(--u) * -1.1);
  border-radius: 50%; background: var(--teal-l);
  box-shadow: 0 0 calc(var(--u) * 3) var(--teal-l);
}

/* ===== Logo & Produkte ===== */
.left { position: relative; flex: none; display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); }
.logo { width: calc(var(--u) * 28); height: auto; display: block; }
.logo .lt { fill: #ffffff; }
.logo .ls { fill: var(--teal-l); }
.tag {
  width: 0; min-width: 100%;
  font-size: calc(var(--u) * 1.3); font-weight: 700; letter-spacing: 0.1em; line-height: 1.5; text-transform: uppercase;
  color: var(--lab);
}
.tag span { white-space: nowrap; }
.tag i { font-style: normal; color: var(--teal-l); padding: 0 0.5em; }

.div { position: relative; flex: none; width: 1px; align-self: stretch; margin: calc(var(--u) * 4) 0; background: var(--bd); }

/* ===== Messe-Infos ===== */
.right { position: relative; display: flex; flex-direction: column; gap: calc(var(--u) * 1.1); min-width: 0; }
.pill {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: calc(var(--u) * 0.6);
  padding: calc(var(--u) * 0.45) calc(var(--u) * 1.1);
  border-radius: 999px;
  font-size: calc(var(--u) * 1.3); font-weight: 800; letter-spacing: 0.1em;
  color: #5bce70; background: rgba(91, 206, 112, 0.13);
}
.dot {
  width: calc(var(--u) * 0.7); height: calc(var(--u) * 0.7); border-radius: 50%;
  background: currentColor; box-shadow: 0 0 calc(var(--u) * 0.8) currentColor;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.35; } }
.h { font-size: calc(var(--u) * 6); font-weight: 800; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
.h span { color: var(--teal-l); }
.meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u) * 0.8) calc(var(--u) * 1.6);
  font-size: calc(var(--u) * 1.8); font-weight: 600; color: var(--t2); white-space: nowrap;
}
.bdg {
  /* dezente Datumspille statt Orange */
  padding: 0.2em 0.65em; border-radius: 0.45em;
  background: rgba(79, 192, 208, 0.10);
  border: 1px solid rgba(79, 192, 208, 0.35);
  color: var(--teal-l); font-weight: 700;
}
.stand { display: inline-flex; align-items: center; gap: 0.45em; color: var(--t1); font-weight: 700; }
.stand svg { width: 1.15em; height: 1.15em; color: var(--teal-l); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.stand i { font-style: normal; color: var(--lab); font-weight: 600; padding: 0 0.15em; }

/* ===== Untereinander (quadratisch / hoch) ===== */
@media (max-aspect-ratio: 7/5) {
  .hdr { flex-direction: column; justify-content: center; align-items: flex-start; gap: calc(var(--u) * 3); padding: calc(var(--u) * 5); }
  .div { width: 100%; height: 1px; align-self: stretch; margin: 0; }
  .waves { right: calc(var(--u) * 10); top: auto; bottom: calc(var(--u) * 12); }
  .meta { flex-direction: column; align-items: flex-start; }
}
/* sehr flach: Nebensächliches weglassen */
@media (max-height: 150px) and (min-aspect-ratio: 7/5) {
  .tag, .pill { display: none; }
}

@media (prefers-reduced-motion: reduce) { .waves i, .dot { animation: none; } }
</style>
</head>
